[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intellion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anthropic>=0.30.0",
    "openai>=1.35.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.45.0",
    "apscheduler>=3.10.0",
    "pypdf2>=3.0.0",
    "openapi-spec-validator>=0.7.0",
    "pyyaml>=6.0.0",
    "graphql-core>=3.2.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
